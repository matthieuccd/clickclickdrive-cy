name: Blog Publish

on:
  schedule:
    # Runs at 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Override publish mode (review or auto)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history so git push works and git log is available
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run publish_next
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE_ARG=""
          if [ -n "${{ github.event.inputs.publish_mode }}" ]; then
            MODE_ARG="--publish-mode ${{ github.event.inputs.publish_mode }}"
          fi
          uv run python -m scraper.publish_next $MODE_ARG
