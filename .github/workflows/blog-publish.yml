name: Blog Publish

on:
  schedule:
    # Runs every hour. publish_next.py checks next_publish_at in blog-queue.json
    # and exits early if it's not time yet — staggered by 65 min per article.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Override publish mode (review or auto)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history so git push works and git log is available
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Debug secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTR }}
          PEXELS_API_KEY: ${{ secrets.PEXELS }}
        run: |
          echo "ANTHROPIC_API_KEY first 10 chars: ${ANTHROPIC_API_KEY:0:10}"
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"
          echo "PEXELS_API_KEY length: ${#PEXELS_API_KEY}"

      - name: Run publish_next
        id: publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTR }}
          PEXELS_API_KEY: ${{ secrets.PEXELS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE_ARG=""
          if [ -n "${{ github.event.inputs.publish_mode }}" ]; then
            MODE_ARG="--publish-mode ${{ github.event.inputs.publish_mode }}"
          fi
          uv run python -m scraper.publish_next $MODE_ARG

      - name: Email notification
        if: steps.publish.outputs.published_url_en != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "onboarding@resend.dev",
              "to": "matthieu@clickclickdrive.net",
              "subject": "Published: ${{ steps.publish.outputs.published_title }}",
              "html": "<p>New article live:</p><ul><li><a href=\"${{ steps.publish.outputs.published_url_el }}\">Greek</a></li><li><a href=\"${{ steps.publish.outputs.published_url_en }}\">English</a></li></ul>"
            }'
