[project]
name = "ccd-cy-scraper"
version = "0.1.0"
description = "ClickClickDrive Cyprus — driving-school discovery scraper"
readme = "CLAUDE.md"
requires-python = ">=3.11"
authors = [
    { name = "ClickClickDrive", email = "engineering@clickclickdrive.com.cy" },
]
license = { text = "Proprietary" }
dependencies = [
    "scrapling>=0.2.9",
    "googlemaps>=4.10.0",
    "pydantic>=2.7",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "curl-cffi>=0.15.0",
    "anthropic>=0.107.1",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
ccd-scrape = "scraper.run:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scraper/tests"]
